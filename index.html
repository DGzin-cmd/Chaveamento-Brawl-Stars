<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campeonato Gamedev — Brawl Stars</title>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:radial-gradient(1200px 600px at 10% -10%,#3b1a7a55,transparent),radial-gradient(900px 500px at 100% 0,#ef444422,transparent),#0a0914;color:#ece9ff;font-family:Rubik,system-ui,sans-serif;min-height:100vh}
.h{font-family:Bungee,Impact,sans-serif;letter-spacing:.02em}
.card{background:linear-gradient(160deg,#17142b,#100e20);border:1px solid #2b2650;border-radius:16px;transition:.2s}
.card:hover{border-color:#7c3aed;transform:translateY(-2px);box-shadow:0 10px 30px #7c3aed22}
.btn{background:linear-gradient(135deg,#7c3aed,#ef4444);border-radius:12px;padding:.55rem 1rem;font-weight:700;transition:.2s;display:inline-flex;gap:.4rem;align-items:center}
.btn:hover{filter:brightness(1.15);transform:scale(1.03)}
.btn2{background:#1f1b3a;border:1px solid #3a3470;border-radius:12px;padding:.45rem .8rem;font-weight:500;transition:.2s}
.btn2:hover{border-color:#facc15}
.in{background:#0d0b1c;border:1px solid #2b2650;border-radius:10px;padding:.5rem .7rem;width:100%;outline:none}
.in:focus{border-color:#3b82f6}
.fade{animation:f .3s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.col{display:flex;flex-direction:column;justify-content:space-around;gap:14px;min-width:230px}
.mt{position:relative;border:1px solid #2b2650;border-radius:12px;background:#131027;overflow:hidden;cursor:pointer;transition:.2s}
.mt:hover{border-color:#facc15}
.col:not(:last-child) .mt::after{content:"";position:absolute;right:-18px;top:50%;width:18px;border-top:2px solid #3a3470}
.row{display:flex;align-items:center;gap:8px;padding:6px 10px}
.win{background:#facc1514;font-weight:700}.lose{opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;padding:.7rem 1.1rem;border-radius:12px;font-weight:700;animation:f .3s}
:root{--ink:#0b1f20;--deep:#0f3b3d;--yel:#ffd21f;--org:#ff8a1f;--red:#e63b3b;--cream:#fff8e6}
body{font-family:Nunito,system-ui,sans-serif;font-weight:700;color:#fff;background:radial-gradient(circle,#2fa5a3 3px,transparent 3.6px) 0 0/20px 20px,radial-gradient(circle,#2fa5a3 3px,transparent 3.6px) 10px 10px/20px 20px,#1c7f82}
.h{font-family:'Titan One',Impact,sans-serif;color:var(--yel);-webkit-text-stroke:.16em var(--ink);paint-order:stroke fill;letter-spacing:.03em;font-weight:400}
.card{background:var(--deep);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink)}
.card:hover{border-color:var(--ink);transform:translateY(-3px);box-shadow:0 8px 0 var(--ink)}
.fade.card:hover{transform:none;box-shadow:0 5px 0 var(--ink)}
.btn{background:var(--yel);color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-weight:800;border-radius:12px;min-height:44px;transition:.12s}
.btn:hover{filter:none;background:#ffe14d;transform:translateY(-1px)}
.btn:active,.btn2:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn2{background:#16787a;color:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);min-height:40px;font-weight:800}
.btn2:hover{border-color:var(--ink);background:#1b9396}
.btn:focus-visible,.btn2:focus-visible,.in:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn:disabled,.btn2:disabled{opacity:.5;pointer-events:none}
.btn.load{pointer-events:none;opacity:.8}
.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--ink);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.in{background:var(--cream);color:var(--ink);border:3px solid var(--ink);font-weight:700}
.in:focus{border-color:var(--org)}
.mt{background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.mt:hover{border-color:var(--org)}
.mt .h{color:var(--red);-webkit-text-stroke:0;font-size:1.3rem!important}
.win{background:var(--yel)!important}
.mt .win .h{color:var(--ink)}
.lose{opacity:.55;filter:grayscale(.6)}
.col:not(:last-child) .mt::after{border-top:3px solid var(--ink);right:-20px;width:20px}
.toast{border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.hd{background:var(--deep);border-bottom:4px solid var(--ink)}
.logo-ic{width:44px;height:44px;border-radius:12px;background:var(--yel);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);transform:rotate(-6deg)}
.lg{font-family:'Titan One',Impact,sans-serif;-webkit-text-stroke:.2em var(--ink);paint-order:stroke fill;line-height:.95}
.lg-w{color:#fff;font-size:12px}.lg-r{color:var(--red);font-size:24px}
.sticker{display:inline-block;font-weight:800;font-size:.75rem;padding:.2rem .6rem;border:2.5px solid var(--ink);border-radius:8px;color:var(--ink);box-shadow:0 2px 0 var(--ink);transform:rotate(-2deg)}
.hero{position:relative;overflow:hidden;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);cursor:pointer;background:radial-gradient(circle,#2fa5a3 3px,transparent 3.6px) 0 0/20px 20px,#1c7f82;animation:pop .5s}
.hero::before{content:"";position:absolute;left:-5%;right:-5%;top:22%;bottom:22%;background:#143e40;transform:skewY(-3deg);box-shadow:0 5px 0 var(--ink)}
.burst{position:absolute;left:4%;top:6%;width:92%;height:88%;animation:pulse 2.4s ease-in-out infinite alternate}
.cloud{display:inline-block;background:var(--cream);border:3px solid var(--ink);border-radius:46px;padding:.4rem 1.6rem;box-shadow:0 5px 0 var(--ink);margin-top:.5rem}
.tagline{display:inline-block;background:var(--red);color:#fff;border:3px solid var(--ink);padding:.15rem .8rem;border-radius:8px;font-size:.75rem;letter-spacing:.12em;font-weight:800;transform:rotate(-2deg)}
.medal{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);font-family:'Titan One';color:var(--ink);background:#ffffff33}
.m1{background:#ffd21f}.m2{background:#d9e2e7}.m3{background:#e8964a}
.champ{border-color:var(--yel)!important;box-shadow:0 0 0 3px var(--yel),0 6px 0 3px var(--ink)!important;animation:pop .8s cubic-bezier(.2,1.6,.4,1);position:relative;padding-top:2rem}
.ribbon{position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-3deg);background:var(--red);color:#fff;border:3px solid var(--ink);padding:.1rem .9rem;border-radius:8px;font-family:'Titan One';white-space:nowrap}
.trophy{display:inline-block;animation:bob 1.2s ease-in-out infinite alternate}
.vs .score{font-family:'Titan One';font-size:1.8rem;background:var(--cream);color:var(--red);border:3px solid var(--ink);border-radius:12px;padding:0 .7rem;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.vs .score i{color:var(--ink);font-style:normal;font-size:1rem;margin:0 .3rem}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{from{transform:scale(.97)}to{transform:scale(1.03)}}
@keyframes bob{to{transform:translateY(-6px) rotate(4deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
const K='arena-clash-v1',uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={aberto:['Inscrições abertas','#2dd4bf'],andamento:['Em andamento','#ff8a1f'],finalizado:['Finalizado','#ffd21f'],cancelado:['Cancelado','#e63b3b']};
const FM={elim:'Eliminação simples',de:'Eliminação dupla',rr:'Todos contra todos'};
const IC={trophy:'M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4zM17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3',users:'M17 21v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2M10 11a4 4 0 100-8 4 4 0 000 8M21 21v-2a4 4 0 00-3-3.9',plus:'M12 5v14M5 12h14',trash:'M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14',swords:'M14 4l6 6M4 20l7-7M14.5 17.5L19 22M5 5l9 9M3 3l3 0 0 3',home:'M3 11l9-8 9 8v10H3z',x:'M6 6l12 12M18 6L6 18',bolt:'M13 2L4 14h7l-1 8 9-12h-7z',cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4'};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[n]}"/></svg>`;
const COL=['#7c3aed','#ef4444','#facc15','#3b82f6','#ec4899','#10b981','#f97316','#06b6d4'];

function seed(){
 const N=[['Raio Roxo','RXO'],['Lobos Carmesim','LCR'],['Estrela Dourada','EDR'],['Maré Azul','MAZ'],['Sombra Neon','SNE'],['Cactos Elétricos','CAC'],['Fênix Urbana','FNX'],['Gemas Rebeldes','GEM']];
 const teams=N.map((n,i)=>({id:'t'+i,name:n[0],tag:n[1],color:COL[i],cap:'',players:[],date:'2026-10-0'+(i+1)}));
 const c1={id:'c1',name:'Copa Gemas Universitária',desc:'O maior torneio 3v3 entre universidades. Mapas de Gem Grab, Brawl Ball e Heist.',format:'elim',max:8,per:3,status:'andamento',date:'2026-11-08T19:00',rules:'Melhor de 3 mapas. Brawlers banidos definidos pelo organizador. Atraso máximo de 10 minutos.',mode:'3v3 Mapas alternados',teamIds:teams.map(t=>t.id),matches:[],champion:null};
 const c2={id:'c2',name:'Liga Showdown Comunitária',desc:'Liga aberta em pontos corridos para a comunidade.',format:'rr',max:6,per:3,status:'aberto',date:'2026-11-22T20:00',rules:'Vitória vale 3 pontos. Desempate por saldo de mapas.',mode:'3v3 Gem Grab',teamIds:['t0','t1','t3','t6'],matches:[],champion:null};
 gen(c1);c1.matches.filter(m=>m.r===0).slice(0,2).forEach((m,i)=>{m.sa=i?1:2;m.sb=i?2:0;m.w=i?m.b:m.a});recompute(c1);
 return {teams,champs:[c1,c2],log:['Equipe Fênix Urbana inscrita na Copa Gemas','Resultado registrado: Raio Roxo avançou nas oitavas','Liga Showdown Comunitária criada']};
}
function genDE(c,ids){let P=4;while(P<ids.length)P*=2;const k=Math.log2(P),L=[];
 const mk=(br,r,i,x)=>{const m={id:br+r+'-'+i,br,r,i,a:null,b:null,sa:null,sb:null,w:null,...x};L.push(m);return m};
 for(let r=1;r<=k;r++)for(let i=0;i<P/2**r;i++){if(r===1)mk('W',1,i,{a:ids[i]||null,b:ids[P-1-i]||null,ta:'S',tb:'S'});else mk('W',r,i,{ta:'W',fa:'W'+(r-1)+'-'+2*i,tb:'W',fb:'W'+(r-1)+'-'+(2*i+1)})}
 for(let j=1;j<=k-1;j++){const n=P/2**(j+1);
  for(let i=0;i<n;i++){if(j===1)mk('L',1,i,{ta:'L',fa:'W1-'+2*i,tb:'L',fb:'W1-'+(2*i+1)});else mk('L',2*j-1,i,{ta:'W',fa:'L'+(2*j-2)+'-'+2*i,tb:'W',fb:'L'+(2*j-2)+'-'+(2*i+1)})}
  for(let i=0;i<n;i++)mk('L',2*j,i,{ta:'W',fa:'L'+(2*j-1)+'-'+i,tb:'L',fb:'W'+(j+1)+'-'+(n-1-i)})}
 mk('GF',1,0,{id:'GF',ta:'W',fa:'W'+k+'-0',tb:'W',fb:'L'+(2*(k-1))+'-0'});
 mk('GF',2,0,{id:'GF2',ta:'A',fa:'GF',tb:'B',fb:'GF'});
 c.matches=L;recDE(c)}
function recDE(c){const by={};c.matches.forEach(m=>by[m.id]=m);const dn=m=>m.w!=null||!!m.dead;
 const get=(t,f)=>{const x=by[f];if(t==='W')return x.w||null;if(t==='L')return x.w&&!x.bye?(x.w===x.a?x.b:x.a):null;return null};
 const clr=m=>{m.w=null;m.sa=m.sb=null};
 for(let p=0;p<80;p++){let ch=false;
  c.matches.forEach(m=>{
   if(m.id==='GF2'){const g=by.GF,live=!!g.w&&g.w===g.b,na=live?g.a:null,nb=live?g.b:null;if(m.a!==na||m.b!==nb){m.a=na;m.b=nb;ch=true}if(m.w&&(!live||m.ra!==m.a||m.rb!==m.b)){clr(m);ch=true}const d=!live&&!!g.w;if(!!m.dead!==d){m.dead=d;ch=true}return}
   let na=m.a,nb=m.b,ra=true,rb=true;
   if(m.ta!=='S'){na=get(m.ta,m.fa);ra=dn(by[m.fa])}
   if(m.tb!=='S'){nb=get(m.tb,m.fb);rb=dn(by[m.fb])}
   if(na!==m.a||nb!==m.b){m.a=na;m.b=nb;ch=true}
   if(m.w&&!m.bye&&(m.ra!==m.a||m.rb!==m.b)){clr(m);ch=true}
   if(ra&&rb){
    if(m.a&&m.b){if(m.bye||m.dead){m.bye=m.dead=false;clr(m);ch=true}}
    else if(m.a||m.b){const s=m.a||m.b;if(!m.bye||m.w!==s){m.bye=true;m.dead=false;m.w=s;m.sa=m.sb=null;ch=true}}
    else if(!m.dead||m.w){m.dead=true;m.bye=false;clr(m);ch=true}
   }else if(m.bye||m.dead){m.bye=m.dead=false;clr(m);ch=true}
  });
  if(!ch)break}
 const gf=by.GF,g2=by.GF2;c.champion=gf.w?(gf.w===gf.a?gf.w:(g2.w||null)):null;
 if(c.champion)c.status='finalizado';else if(c.status==='finalizado')c.status='andamento'}
const deName=(c,m)=>{if(m.id==='GF')return 'GRANDE FINAL';if(m.id==='GF2')return 'GRANDE FINAL · RESET';const k=Math.max(...c.matches.filter(x=>x.br==='W').map(x=>x.r));return m.br==='W'?(m.r===k?'FINAL SUPERIOR':'SUPERIOR · R'+m.r):(m.r===2*(k-1)?'FINAL INFERIOR':'INFERIOR · R'+m.r)};
const mlabel=(c,m)=>c.format==='rr'?'RODADA':c.format==='de'?deName(c,m):rname(c,m.r).toUpperCase();
function bracketDE(c){const ml=(br,r)=>c.matches.filter(m=>m.br===br&&m.r===r&&!m.dead).sort((a,b)=>a.i-b.i);
 const k=Math.max(...c.matches.filter(m=>m.br==='W').map(m=>m.r)),nL=2*(k-1);
 const sec=(t,n,br,nm)=>`<div class="mb-6"><div class="h text-lg mb-2">${t}</div><div class="overflow-x-auto pb-3"><div class="flex gap-9">${Array.from({length:n},(_,j)=>`<div class="col"><div class="text-xs font-bold tracking-widest text-center" style="color:#facc15">${nm(j+1)}</div>${ml(br,j+1).map(m=>mcard(c,m)).join('')}</div>`).join('')}</div></div></div>`;
 const gf=c.matches.find(m=>m.id==='GF'),g2=c.matches.find(m=>m.id==='GF2'),champ=c.champion?T(c.champion):null;
 return sec('Chave dos vencedores',k,'W',r=>r===k?'FINAL SUPERIOR':'SUPERIOR · R'+r)+sec('Chave dos perdedores',nL,'L',r=>r===nL?'FINAL INFERIOR':'INFERIOR · R'+r)+`<div class="h text-lg mb-2">Grande final</div><div class="flex flex-wrap gap-6 items-start"><div style="min-width:230px;max-width:300px">${mcard(c,gf)}<div class="text-xs mt-2 opacity-80">Quem vem da chave inferior precisa vencer duas vezes.</div></div>${g2.dead?'<div class="text-xs opacity-80" style="max-width:260px">Reset: só acontece se o time da chave inferior vencer a Grande Final.</div>':`<div style="min-width:230px;max-width:300px">${mcard(c,g2)}</div>`}${champ?`<div class="card champ p-5 text-center"><div class="ribbon">CAMPEÃ</div><div class="trophy" style="color:#ffd21f">${ic('trophy',44)}</div>${av(champ,64)}<div class="h mt-2">${esc(champ.name)}</div></div>`:''}</div>`}
function gen(c){
 const ids=c.teamIds.slice();c.matches=[];c.champion=null;
 if(c.format==='de'){genDE(c,ids);return}
 if(c.format==='rr'){let k=0;for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)c.matches.push({id:uid(),r:0,i:k++,a:ids[i],b:ids[j],sa:null,sb:null,w:null});return}
 let size=2;while(size<ids.length)size*=2;const R=Math.log2(size);
 for(let r=0;r<R;r++)for(let i=0;i<size/2**(r+1);i++)c.matches.push({id:uid(),r,i,a:null,b:null,sa:null,sb:null,w:null,bye:false});
 c.matches.filter(m=>m.r===0).forEach(m=>{m.a=ids[m.i]||null;m.b=ids[size-1-m.i]||null});
 recompute(c);
}
function recompute(c){if(c.format==='de')return recDE(c);
 if(c.format==='rr'){const done=c.matches.every(m=>m.w);if(done&&c.matches.length){const t=table(c);c.champion=t[0].id;c.status='finalizado'}return}
 const R=Math.max(...c.matches.map(m=>m.r))+1;
 for(let r=0;r<R;r++)c.matches.filter(m=>m.r===r).forEach(m=>{
  if(r>0){const p=c.matches.filter(x=>x.r===r-1);m.a=p[m.i*2].w;m.b=p[m.i*2+1].w}
  if(m.w&&m.w!==m.a&&m.w!==m.b){m.w=null;m.sa=m.sb=null}
  if(r===0||true){const solo=(m.a&&!m.b&&r===0)?m.a:(m.b&&!m.a&&r===0)?m.b:null;if(solo){m.w=solo;m.bye=true}}
 });
 const f=c.matches.find(m=>m.r===R-1);c.champion=f.w||null;
 if(f.w)c.status='finalizado';else if(c.status==='finalizado')c.status='andamento';
}
function table(c){
 const t={};c.teamIds.forEach(id=>t[id]={id,p:0,v:0,d:0,pts:0,s:0});
 c.matches.filter(m=>m.w&&!m.bye).forEach(m=>{const l=m.w===m.a?m.b:m.a;t[m.w].p++;t[l].p++;t[m.w].v++;t[l].d++;t[m.w].pts+=3;t[m.a].s+=m.sa-m.sb;t[m.b].s+=m.sb-m.sa});
 return Object.values(t).sort((a,b)=>b.pts-a.pts||b.s-a.s);
}
let S=(()=>{try{const s=localStorage.getItem(K);if(s)return JSON.parse(s)}catch(e){}return seed()})();
let R={v:'dash',id:null,tab:'geral',q:'',f:''},M=null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const log=m=>{S.log.unshift(m);S.log=S.log.slice(0,8)};
const T=id=>S.teams.find(t=>t.id===id);
const C=id=>S.champs.find(c=>c.id===id);
function toast(m,ok=true){const e=document.getElementById('toast');e.innerHTML=`<div class="toast" style="background:${ok?'#10b981':'#ef4444'}">${esc(m)}</div>`;setTimeout(()=>e.innerHTML='',2600);return ok?undefined:false}
const av=(t,s=40)=>t?`<div class="grid place-items-center shrink-0 h" style="width:${s}px;height:${s}px;border-radius:${s/3}px;background:${t.color};color:#fff;font-size:${s/3}px;border:3px solid #0b1f20;box-shadow:0 2px 0 #0b1f20">${esc(t.tag.slice(0,3))}</div>`:`<div class="shrink-0" style="width:${s}px;height:${s}px;border-radius:${s/3}px;background:#1f1b3a"></div>`;
const badge=s=>`<span class="sticker" style="background:${ST[s][1]}">${ST[s][0]}</span>`;
const rname=(c,r)=>{const R=Math.max(...c.matches.map(m=>m.r))+1;return r===R-1?'Final':r===R-2?'Semifinais':r===R-3?'Quartas':'Rodada '+(r+1)};

/* ---------- views ---------- */
function mcard(c,m){
 const row=(id,s)=>{const t=T(id),w=m.w&&m.w===id,l=m.w&&id&&m.w!==id;return `<div class="row ${w?'win':''} ${l?'lose':''}">${av(t,26)}<span class="flex-1 truncate text-sm">${t?esc(t.name):'A definir'}</span><b class="h text-sm">${s==null?'':s}</b></div>`};

 champ:i=>{R.v='champ';R.id=i;R.tab='geral'},
 tab:i=>{R.tab=i},
 close:()=>{M=null},stop:()=>{},
 clog:()=>{M={t:'conf',msg:'Limpar todo o histórico de atividade recente? Campeonato, equipes e resultados não serão afetados.',act:'doclog'}},
 doclog:()=>{S.log=[];M=null;toast('Atividade limpa.')},
 exp:async k=>{if(EX)return false;M=null;const c=C(R.id);if(!c||!c.matches.length)return toast('Gere o chaveamento antes de exportar.',false);EX=true;render();
  try{await new Promise(r=>setTimeout(r,60));const v=R.xm,only=(v===undefined||v==='all')?null:+v;const o=await doExport(c,only,k==='svg'?'svg':'png');M={t:'img',...o};toast('Imagem gerada!');saveImg(o)}catch(e){toast('Falha ao gerar a imagem: '+((e&&e.message)||e),false)}
  EX=false;render();return false},
 xopen:()=>{M={t:'xo'}},
 dlimg:async()=>{if(M&&M.blob)await saveImg(M);return false},
 shareimg:async()=>{try{await navigator.share({files:[new File([M.blob],M.name,{type:M.blob.type||'image/png'})],title:'Chaveamento'})}catch(e){if(e&&e.name!=='AbortError')toast('Não foi possível compartilhar. Use Abrir imagem.',false)}return false},
 newc:()=>{M={t:'champ',c:S.champs[0]}},
 edit:i=>{M={t:'champ',c:C(i)}},
 savec:()=>{const n=val('f_n'),mx=+val('f_m'),old=M.c||{};
  if(n.length<3)return bad('Informe um nome com ao menos 3 caracteres.','f_n');
  if(S.champs.some(c=>c.name.toLowerCase()===n.toLowerCase()&&(!M.c||c.id!==M.c.id)))return bad('Já existe um campeonato com esse nome.','f_n');
  if(!val('f_dt'))return bad('Escolha a data e o horário.','f_dt');
  if(!(mx>=2&&mx<=64))return bad('Informe um limite de equipes entre 2 e 64.','f_m');
  if(old.matches&&old.matches.length&&val('f_f')!==old.format)return bad('Não é possível mudar o formato com o chaveamento já gerado.','f_f');
  const d={name:n,desc:val('f_d'),date:val('f_dt'),max:mx,per:old.per||3,format:val('f_f'),status:val('f_s'),mode:old.mode||'3v3',rules:val('f_r')};
  if(M.c){if(d.max<M.c.teamIds.length)return bad('Vagas abaixo do número de equipes inscritas.','f_m');Object.assign(M.c,d);toast('Campeonato atualizado.');}
  else{const c={id:uid(),teamIds:[],matches:[],champion:null,...d};S.champs.unshift(c);log('Campeonato criado: '+n);toast('Campeonato criado.');R.v='champ';R.id=c.id;R.tab='equipes'}
  M=null},
 delc:i=>{M={t:'conf',msg:'Excluir este campeonato e todas as partidas?',act:'dodelc',id:i}},
 dodelc:i=>{S.champs=S.champs.filter(c=>c.id!==i);R.v='champs';M=null;toast('Campeonato excluído.')},
 cancel:i=>{M={t:'conf',msg:'Cancelar este campeonato?',act:'docancel',id:i}},
 docancel:i=>{C(i).status='cancelado';M=null;toast('Campeonato cancelado.')},
 newteam:()=>{M={t:'team'}},
 savet:()=>{const n=val('t_n'),tg=val('t_t').toUpperCase(),pl=val('t_p').split('\n').map(s=>s.trim()).filter(Boolean);
  if(n.length<3||tg.length<2)return toast('Nome (3+) e tag (2+) são obrigatórios.',false);
  if(S.teams.some(t=>t.name.toLowerCase()===n.toLowerCase()||t.tag===tg))return toast('Já existe uma equipe com esse nome ou tag.',false);
  
  S.teams.push({id:uid(),name:n,tag:tg,color:COL[S.teams.length%8],cap:val('t_c'),players:pl,date:new Date().toISOString().slice(0,10)});log('Nova equipe cadastrada: '+n);M=null;toast('Equipe cadastrada.')},
 delteam:i=>{if(S.champs.some(c=>c.teamIds.includes(i)))return toast('Equipe inscrita em campeonato; remova antes.',false);S.teams=S.teams.filter(t=>t.id!==i);toast('Equipe removida.')},
 addteam:i=>{M={t:'add',id:i}},
 doadd:()=>{const c=C(R.id),id=val('a_t');
  if(c.status!=='aberto')return toast('Inscrições encerradas neste campeonato.',false);
  if(c.teamIds.length>=c.max)return toast('Limite de vagas atingido.',false);
  if(c.teamIds.includes(id))return toast('Equipe já inscrita.',false);
  c.teamIds.push(id);log(T(id).name+' inscrita em '+c.name);M=null;toast('Equipe inscrita.')},
 rmteam:i=>{const c=C(R.id);if(c.matches.length)return toast('Chaveamento já gerado. Regere após remover.',false);c.teamIds=c.teamIds.filter(x=>x!==i);toast('Inscrição removida.')},
 gen:i=>{const c=C(i);if(c.teamIds.length<2)return toast('Inscreva ao menos 2 equipes.',false);
  if(c.format==='de'&&c.teamIds.length<3)return toast('Eliminação dupla exige ao menos 3 equipes.',false);
  if(c.status==='aberto'||c.status==='finalizado')c.status='andamento';gen(c);log('Chaveamento gerado: '+c.name);R.tab='chave';toast('Chaveamento gerado.')},
 res:i=>{M={t:'res',id:i}},
 dores:()=>{const c=C(R.id),m=c.matches.find(x=>x.id===M.id),sa=parseInt(val('r_sa')),sb=parseInt(val('r_sb'));
  if(isNaN(sa)||isNaN(sb)||sa<0||sb<0)return toast('Informe placares válidos.',false);
  if(sa===sb)return toast('Empate não é permitido; defina um vencedor.',false);
  m.sa=sa;m.sb=sb;m.w=sa>sb?m.a:m.b;m.ra=m.a;m.rb=m.b;recompute(c);if(c.status==='aberto')c.status='andamento';
  log('Resultado: '+T(m.a).tag+' '+sa+' x '+sb+' '+T(m.b).tag);M=null;
  toast(c.champion?'Campeã definida: '+T(c.champion).name:'Vencedor avançou na chave.')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;
 if(el.dataset.a==='close'&&e.target.closest('[data-a="stop"]')&&!e.target.closest('button[data-a="close"]'))return;
 if(el.dataset.a==='stop')return;
 const f=A[el.dataset.a];if(f){const r=f(el.dataset.i);save();if(r!==false)render()}});
document.addEventListener('input',e=>{if(e.target.id==='xm')R.xm=e.target.value;if(e.target.closest&&e.target.closest('#cf')){prevC();e.target.style.borderColor=''}
 if(e.target.id==='q'){R.q=e.target.value;document.getElementById('list').innerHTML=champList()}
 if(e.target.id==='fs'){R.f=e.target.value;document.getElementById('list').innerHTML=champList()}});
render();
</script>
</body>
</html>
